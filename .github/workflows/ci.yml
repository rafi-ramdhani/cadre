name: CI

on:
  push:
    branches: [main, rewrite/0.2.0]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux shellcheck jq
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux shellcheck jq
      - name: Configure git
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - name: Lint
        run: shellcheck -x bin/cadre bin/orchestrator-hook.sh install.sh tests/smoke-bash.sh tests/smoke.sh
      - name: Smoke test (bash version, until the Go one reaches parity)
        run: tests/smoke-bash.sh

  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The version go.mod declares, and the latest stable that releases use.
        go: [go.mod, stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Configure git
        run: |
          git config --global user.name CI
          git config --global user.email ci@example.com
          git config --global init.defaultBranch main
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...
      - name: Test
        run: go test -race ./...
      - name: Test with the test-only parts (-tags cadretest)
        run: go test -race -tags cadretest ./...
      - name: Smoke test against the Go binary
        run: tests/smoke.sh
      - name: Windows build (the binary refuses to run there)
        if: runner.os == 'Linux' && matrix.go == 'stable'
        run: GOOS=windows go build -o /dev/null ./cmd/cadre

  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - name: No test hooks in release binaries
        run: |
          for b in dist/*/cadre; do
            if grep -a -q CADRE_TEST_ "$b"; then echo "$b holds a CADRE_TEST_ hook"; exit 1; fi
          done
