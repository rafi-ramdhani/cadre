name: CI

on:
  push:
    branches: [main, rewrite/0.2.0]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck tmux
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck tmux
      - name: Configure git
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - name: Lint
        run: shellcheck -x bin/cadre bin/orchestrator-hook.sh install.sh packaging/homebrew/formula.sh tests/smoke.sh tests/bridge.sh
      # 0.1.x installs point into a clone of this repository; a pull must
      # leave them quiet and pointing to the new install.
      - name: The bridge for 0.1.x installs
        run: tests/bridge.sh

  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The version go.mod declares, and the latest stable that releases use.
        go: [go.mod, stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Configure git
        run: |
          git config --global user.name CI
          git config --global user.email ci@example.com
          git config --global init.defaultBranch main
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      # On the go.mod version only: a staticcheck release can lag a new Go
      # (2026.2.1 cannot read Go 1.27.2's export data).
      - name: Staticcheck
        if: matrix.go == 'go.mod'
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...
      - name: Test
        run: go test -race ./...
      - name: Test with the test-only parts (-tags cadretest)
        run: go test -race -tags cadretest ./...
      - name: Smoke test against the Go binary
        run: tests/smoke.sh
      - name: Windows build (the binary refuses to run there)
        if: runner.os == 'Linux' && matrix.go == 'stable'
        run: GOOS=windows go build -o /dev/null ./cmd/cadre

  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - name: No test hooks in release binaries
        run: |
          for b in dist/*/cadre; do
            if grep -a -q CADRE_TEST_ "$b"; then echo "$b holds a CADRE_TEST_ hook"; exit 1; fi
          done
      - name: The Homebrew formula builds from the snapshot's checksums
        run: |
          archive=$(ls dist/cadre_*_linux_amd64.tar.gz)
          version=${archive#dist/cadre_}
          version=${version%_linux_amd64.tar.gz}
          packaging/homebrew/formula.sh "$version" dist/checksums.txt > cadre.rb
          ruby -c cadre.rb
          ! grep -q @ cadre.rb
