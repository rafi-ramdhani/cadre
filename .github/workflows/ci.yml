name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux shellcheck jq
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux shellcheck jq
      - name: Configure git
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - name: Lint
        run: shellcheck -x bin/cadre bin/orchestrator-hook.sh install.sh tests/smoke.sh
      - name: Smoke test
        run: tests/smoke.sh
